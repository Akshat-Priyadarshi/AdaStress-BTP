# =============================================================================
# AdaStress configuration -- BTP run on real WESAD, 13 channels at 1 Hz
#
# This is a copy of the repository's own configs/config.yaml.
#
# ONLY the data paths and the checkpoint paths are changed. Every single
# hyperparameter below is exactly as the repository ships it: 60 second
# windows, stride 30, temperature 0.5, 128 LSTM hidden units, 20 epochs,
# context gate on. Nothing about the model has been touched.
#
# What changed, and why:
#
#   unlabelled_csv / labelled_csv
#       The repository points these at data/sample_data.csv, which its own
#       comment describes as a smoke test. It is 999 rows, every value
#       squashed between 0 and 1, and Task has 7 values where WESAD has 5
#       sessions. It is not WESAD.
#
#       They now point at the real WESAD data, converted into the 13 columns
#       this config asks for by btp/20_build_wesad_13ch.py.
#
#   paths.*
#       Written into runs/ instead of checkpoints/, so each run keeps its own
#       encoder and classifier and nothing is ever overwritten.
#
# HOW TO RUN, from the AdaStress_BTP folder:
#
#   python3 vendor/adastress/scripts/pretrain_encoder.py \
#       --config configs/btp_13ch.yaml
#
#   python3 vendor/adastress/scripts/train_classifier.py \
#       --config configs/btp_13ch.yaml --seed 42
#
# Both are the repository's own scripts, unmodified. The wrapper adds the
# repo to the import path itself, so nothing needs to be copied and
# vendor/adastress can stay read-only.
# =============================================================================

# VARIANT: Task removed from the context, everything else identical.
#
# Why: Task on its own predicts the stress label with 100% accuracy on
# held-out people. The label comes from one PANAS questionnaire per
# session, and Task IS the session, so they are the same thing under two
# names. Comparing this run against the full-context run says how much of
# the paper's context is real and how much is only Task.
#
# The encoder is NOT retrained. Self-supervised pretraining never touches
# context, so the same encoder from L01 is reused. Only the classifier
# and the gate are trained here, which is the repo's own design.

seed: 42
device: "auto"   # "auto" | "cpu" | "cuda"

data:
  # CHANGED: real WESAD instead of the bundled smoke-test file.
  #   wesad_all.csv      86,868 rows, every second of all 15 subjects
  #                      -> 2,894 windows for self-supervised pretraining
  #   wesad_labelled.csv 46,485 rows, only the parts inside the five sessions
  #                      -> 1,529 labelled windows
  unlabelled_csv: "data/processed/wesad_13ch_corrected/wesad_all.csv"
  labelled_csv: "data/processed/wesad_13ch_corrected/wesad_labelled.csv"

  label_column: "Stress_Class"
  subject_column: "Subject_ID"
  context_columns: ["SessionPhase", "Activity"]
  signal_columns:
    - ACC_X
    - ACC_Y
    - ACC_Z
    - ECG
    - EDA
    - Temp
    - Resp
    - ACC_X_wrist
    - ACC_Y_wrist
    - ACC_Z_wrist
    - BVP
    - EDA_wrist
    - Temp_wrist

window:
  window_sec: 60
  stride_sec: 30
  fs: 1

ssl:
  batch_size: 128
  epochs: 20
  lr: 0.001
  temperature: 0.5
  proj_dim: 128
  lstm_hidden: 128        # encoder output = 2 * lstm_hidden (bidirectional)

classifier:
  batch_size: 64
  epochs: 20
  lr: 0.001
  dropout: 0.3
  use_context_gate: true
  context_embed_dim: 32

drift:
  num_bins: 20
  history_window: 300
  min_buffer_for_check: 15
  check_every_n_windows: 5
  smoothing_eps: 1.0e-6

continual_learning:
  method: "ewc"
  ewc_lambda: 400.0
  l2_lambda: 0.01
  adapt_epochs: 5
  adapt_lr: 1.0e-4
  adapt_batch_size: 8
  fisher_num_batches: 50

paths:
  # CHANGED: one folder per run, so nothing is overwritten.
  checkpoints_dir: "runs/L09_repo_noTask"
  encoder_ckpt: "runs/L01_repo_faithful/encoder.pth"
  scaler_ckpt: "runs/L01_repo_faithful/scaler.pkl"
  meta_json: "runs/L01_repo_faithful/meta.json"
  classifier_ckpt: "runs/L09_repo_noTask/classifier.pth"
  fisher_ckpt: "runs/L09_repo_noTask/fisher.pt"
  theta_star_ckpt: "runs/L09_repo_noTask/theta_star.pt"
  drift_reference_ckpt: "runs/L09_repo_noTask/drift_reference.pt"
  results_dir: "runs/L09_repo_noTask/results"
